name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_composer:
        description: Force Composer install on the server even if composer files are unchanged
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, bcmath, gd, fileinfo, zip, pcntl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

  deploy:
    name: Deploy to Hostinger
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: hostinger-production
      cancel-in-progress: false

    steps:
      - name: Verify deployment actor
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          if [ "$DEPLOY_ACTOR" != "vivek-ranjan-16cs086" ]; then
            echo "Deployment blocked: only vivek-ranjan-16cs086 can publish."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Composer changes
        id: changes
        env:
          FORCE_COMPOSER: ${{ github.event.inputs.force_composer || 'false' }}
        run: |
          if [ "$FORCE_COMPOSER" = "true" ]; then
            echo "composer=true" >> "$GITHUB_OUTPUT"
            echo "Forcing Composer install on the server."
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -E '^(composer\.lock|composer\.json)$' >/dev/null; then
              echo "composer=true" >> "$GITHUB_OUTPUT"
              echo "Composer files changed; dependencies will be installed on the server."
            else
              echo "composer=false" >> "$GITHUB_OUTPUT"
              echo "Composer files are unchanged; server Composer install will be skipped."
            fi
          else
            echo "composer=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit found; installing Composer dependencies on the server."
          fi

      - name: Check FTP credentials
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || vars.FTP_SERVER || vars.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Set FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD in repository or production-environment secrets."
            exit 1
          fi

          server="${FTP_SERVER#ftp://}"
          server="${server#ftps://}"
          server="${server%%/*}"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Check SSH credentials
        id: ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.HOST || vars.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSHKEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || vars.SSH_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$SSH_HOST" ] && { [ -n "$SSH_KEY" ] || [ -n "$SSH_PASSWORD" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH is not configured; server-side Composer install and Laravel cache clearing are unavailable."
          fi

      - name: Require SSH when Composer dependencies change
        if: steps.changes.outputs.composer == 'true' && steps.ssh.outputs.configured != 'true'
        run: |
          echo "::error::Composer files changed (or force_composer is true), but SSH is not configured. Set SSH_HOST and SSHKEY or SSH_PASSWORD."
          exit 1

      - name: Restore FTP sync state
        uses: actions/cache/restore@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ftp-sync-${{ github.ref_name }}-

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /
          timeout: 60000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/.gitignore
            **/.gitattributes
            **/.editorconfig
            **/.styleci.yml
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/error_log
            **/*.sql
            **/.ftp-deploy-sync-state.json
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/storage/api-docs/**
            **/public/storage
            **/public/storage/**
            **/public/assets/libraries/**
            **/*.mmdb
            **/*.mp4
            **/.idea/**
            **/.vscode/**
            **/.cursor/**
            **/README.md
            **/composer.phar

      - name: Save FTP sync state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-${{ github.ref_name }}-${{ github.run_id }}

      - name: Install PHP packages and clear Laravel caches
        if: steps.ssh.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          RUN_COMPOSER: ${{ steps.changes.outputs.composer }}
        with:
          host: ${{ secrets.SSH_HOST || secrets.HOST || secrets.FTP_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME || secrets.USER || secrets.FTP_USERNAME }}
          key: ${{ secrets.SSHKEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 65002 }}
          command_timeout: 15m
          script_stop: true
          envs: RUN_COMPOSER
          script: |
            set -e
            if [ -d "$HOME/domains/whitehatrealty.in/public_html" ]; then
              cd "$HOME/domains/whitehatrealty.in/public_html"
            elif [ -d "$HOME/public_html" ]; then
              cd "$HOME/public_html"
            else
              echo "Could not find the Laravel public_html directory."
              exit 1
            fi

            echo "Deploy directory: $(pwd)"
            if [ "$RUN_COMPOSER" = "true" ]; then
              composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            fi

            php artisan optimize:clear
            if [ ! -e public/storage ]; then
              php artisan storage:link
            fi
