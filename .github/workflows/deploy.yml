name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, bcmath, gd, fileinfo, zip, pcntl, pdo_sqlite, curl, sodium
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

  deploy:
    name: Deploy to Hostinger
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: hostinger-production
      cancel-in-progress: false

    steps:
      - name: Verify deployment actor
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          if [ "$DEPLOY_ACTOR" != "vivek-ranjan-16cs086" ]; then
            echo "Deployment blocked: only vivek-ranjan-16cs086 can publish."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check FTP credentials
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || vars.FTP_SERVER || vars.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Set FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD in repository or production-environment secrets."
            exit 1
          fi

          server="${FTP_SERVER#ftp://}"
          server="${server#ftps://}"
          server="${server%%/*}"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Restore FTP sync state
        uses: actions/cache/restore@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-zitrackapi-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ftp-sync-zitrackapi-${{ github.ref_name }}-

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /zitrackapi/
          timeout: 60000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/.gitignore
            **/.gitattributes
            **/.editorconfig
            **/.styleci.yml
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/error_log
            **/*.sql
            **/.ftp-deploy-sync-state.json
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/storage/app/private/**
            **/storage/framework/testing/**
            **/storage/api-docs/**
            **/storage/public
            **/public/storage
            **/public/storage/**
            **/public/assets/libraries/**
            **/*.mmdb
            **/*.mp4
            **/.idea/**
            **/.vscode/**
            **/.cursor/**
            **/README.md
            **/composer.phar

      - name: Save FTP sync state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-zitrackapi-${{ github.ref_name }}-${{ github.run_id }}

      - name: Show manual server commands
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Files uploaded ? run the server commands manually

          No SSH connection is made by this workflow. In your Hostinger SSH
          terminal, open the Laravel directory containing `artisan`, then run:

          ```bash
          set -e
          test -f artisan || { echo "Open the Laravel project directory first"; exit 1; }
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          php artisan config:clear
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache
          php artisan migrate:status
          ```

          Back up the production database before running migrations.
          File upload is complete; server activation remains manual.
          SUMMARY
